<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 6s linear infinite;
      }
      .floating-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" />

  <!-- Animated Dynamic Background Chart / Grid Elements (Behind Text) -->
  <g opacity="0.25">
    <path d="M0,240 Q300,180 600,220 T1200,160" fill="none" stroke="#10b981" stroke-width="2" class="pulse-line" />
    <path d="M0,280 Q400,200 800,250 T1200,210" fill="none" stroke="#06b6d4" stroke-width="1.5" class="pulse-line" />
    <!-- Dynamic grid lines -->
    <line x1="100" y1="0" x2="100" y2="320" stroke="#334155" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="320" stroke="#334155" stroke-width="1" />
    <line x1="500" y1="0" x2="500" y2="320" stroke="#334155" stroke-width="1" />
    <line x1="700" y1="0" x2="700" y2="320" stroke="#334155" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="320" stroke="#334155" stroke-width="1" />
    <line x1="1100" y1="0" x2="1100" y2="320" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Subtle Dynamic Energy Pulse Ring (Floating Background Decor) -->
  <g class="floating-node" opacity="0.3">
    <circle cx="1020" cy="110" r="70" stroke="#10b981" stroke-width="2" fill="none" />
    <circle cx="1020" cy="110" r="45" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" fill="none" />
    <circle cx="180" cy="230" r="50" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  </g>

  <!-- Foreground Text Content (Prominent & Clear) -->
  <g text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 68)">
      <path d="M-15,10 L0,-20 L15,10 L3,10 L8,25 L-12,5 L-2,5 Z" fill="#34d399" filter="url(#glow)"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Energy Management Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      ⚡ Curated SaaS Products &amp; Open-Source Ecosystem for Energy Intelligence, ESG &amp; Smart Buildings ⚡
    </text>

    <!-- Stat/Tag Badges -->
    <g transform="translate(360, 225)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#10b981">🌱 Sustainability</text>
      
      <rect x="150" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="220" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🏢 Smart Buildings</text>

      <rect x="305" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="392" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">📊 Utility Intelligence</text>
    </g>
  </g>
</svg>
