<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#052e16"/></linearGradient><linearGradient id="grid" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981" stop-opacity=".1"/><stop offset="50%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#10b981" stop-opacity=".1"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#34d399"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a7f3d0"/></linearGradient><filter id="glow"><feGaussianBlur result="coloredBlur" stdDeviation="3"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes float{0%{transform:translateY(0)}}.pulse-line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:dash 6s linear infinite}.floating-node{animation:float 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="320" fill="url(#bg)" rx="16"/><g opacity=".25"><path fill="none" stroke="#10b981" stroke-width="2" d="M0,240 Q300,180 600,220 T1200,160" class="pulse-line"/><path fill="none" stroke="#06b6d4" stroke-width="1.5" d="M0,280 Q400,200 800,250 T1200,210" class="pulse-line"/><line x1="100" x2="100" y1="0" y2="320" stroke="#334155" stroke-width="1"/><line x1="300" x2="300" y1="0" y2="320" stroke="#334155" stroke-width="1"/><line x1="500" x2="500" y1="0" y2="320" stroke="#334155" stroke-width="1"/><line x1="700" x2="700" y1="0" y2="320" stroke="#334155" stroke-width="1"/><line x1="900" x2="900" y1="0" y2="320" stroke="#334155" stroke-width="1"/><line x1="1100" x2="1100" y1="0" y2="320" stroke="#334155" stroke-width="1"/></g><g class="floating-node" opacity=".3"><circle cx="1020" cy="110" r="70" fill="none" stroke="#10b981" stroke